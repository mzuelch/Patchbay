[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patchbay"
version = "0.1.0"
description = "PATCHBAY: desktop GUI + backend wrapper for facebook/SAM-Audio models (chunking, anchors, AudioFX plugins)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Michael Zülch"}]

# IMPORTANT:
# You may prefer to manage (pin) these dependencies in your environment/conda
# rather than as package dependencies, because ML stacks are sensitive to
# CUDA/CPU builds.
dependencies = [
    "torch",
    "torchaudio",
    "transformers",
    "huggingface_hub",
    # The actual model wrapper package used by this backend:
    "sam_audio",
]

[project.optional-dependencies]
gui = [
    "dearpygui>=1.10",
    "numpy",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
]

[project.scripts]
patchbay-anchor = "patchbay_backend.cli:main"
patchbay-gui = "patchbay_desktop_gui.app:main"

# Legacy entry points (kept for compatibility)
sam-audio-anchor = "patchbay_backend.cli:main"
sam-audio-gui = "patchbay_desktop_gui.app:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["patchbay_backend*", "patchbay_desktop_gui*"]
